<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ocean AI Insights, OceanGate Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="oai.css">
<template id="__bundler_thumbnail" data-bg-color="#07182b">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#07182b"/>
    <rect x="90" y="120" width="1020" height="120" rx="16" fill="#0C2640"/>
    <text x="130" y="180" font-family="monospace" font-size="26" fill="#16C2C2" letter-spacing="4">OCEAN AI · INSIGHTS</text>
    <text x="130" y="215" font-family="sans-serif" font-size="20" fill="#E6EEF6">From 88,658 messages to decisions.</text>
    <g>
      <rect x="90" y="290" width="235" height="150" rx="14" fill="#0C2640"/>
      <rect x="345" y="290" width="235" height="150" rx="14" fill="#0C2640"/>
      <rect x="600" y="290" width="235" height="150" rx="14" fill="#0C2640"/>
      <rect x="855" y="290" width="255" height="150" rx="14" fill="#0C2640"/>
      <text x="115" y="375" font-family="monospace" font-size="46" fill="#16C2C2">88,658</text>
      <text x="370" y="375" font-family="monospace" font-size="46" fill="#E6EEF6">7,173</text>
      <text x="625" y="375" font-family="monospace" font-size="46" fill="#2E9E5B">41s</text>
      <text x="880" y="375" font-family="monospace" font-size="46" fill="#E5B567">4.3×</text>
    </g>
    <circle cx="600" cy="620" r="90" fill="none" stroke="#16C2C2" stroke-width="26" stroke-dasharray="390 180"/>
  </svg>
</template>
</head>
<body class="exec">
<div class="app">
  <div class="brand">
    <div class="brand-mark">
      <img src="ocean-logo.png" alt="Ocean logo">
    </div>
    <div>
      <div class="brand-name">Ocean <span>AI</span></div>
      <div class="brand-sub">Insights</div>
    </div>
  </div>

  <nav class="nav" id="nav"></nav>

  <div class="topbar">
    <div class="crumb"><span>Ocean AI</span><span class="sep">/</span><b id="crumb">Executive Overview</b></div>
    <div class="tb-spacer"></div>
    <div class="filters">
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Date: <b>All time</b></div>
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Filters</div>
      <div class="chip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>WhatsApp · <b>87%</b></div>
    </div>
    <div class="seg" id="modeToggle">
      <button class="on" data-mode="exec">Executive Story</button>
      <button data-mode="op">Operational Detail</button>
    </div>
    <button class="tb-btn" id="themeBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg><span id="themeLbl">Light</span></button>
    <button class="tb-btn" id="presentBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>Present</button>
    <button class="tb-btn" onclick="window.print()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 9V2h12v7M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2M6 14h12v8H6z"/></svg>Export</button>
  </div>

  <main class="main" id="main"></main>
</div>

<script src="oai-data.js"></script>
<script src="oai-ui.js"></script>
<script src="oai-screens-1.js"></script>
<script src="oai-screens-2.js"></script>
<script src="oai-screens-3.js"></script>
<script>
(function () {
  const ICON = {
    grid: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
    chat: '<path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>',
    target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    ship: '<path d="M3 13c2 0 2 2 4.5 2S10 13 12 13s2 2 4.5 2S19 13 21 13M5 13V7l7-3 7 3v6M12 4v9M9 19c2 0 2 1.5 4.5 1.5"/>',
    spark: '<path d="M12 2l2 7 7 2-7 2-2 7-2-7-7-2 7-2z"/>',
    rules: '<path d="M4 6h12M4 12h16M4 18h9M18 4l3 3-3 3"/>',
    shield: '<path d="M12 2l8 4v6c0 5-3.5 8-8 10-4.5-2-8-5-8-10V6z"/>',
    help: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 115 .5c0 1.5-2.5 2-2.5 3.5M12 17h.01"/>',
    check: '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/>',
    flow: '<rect x="3" y="3" width="6" height="6" rx="1"/><rect x="15" y="15" width="6" height="6" rx="1"/><path d="M9 6h6a3 3 0 013 3v6"/>',
  };
  const S = window.OAISCREENS;
  const groups = ["OVERVIEW", "REVENUE", "INTELLIGENCE", "GOVERNANCE"];
  const order = ["executive", "conversation", "radar", "cargo", "shein", "rules", "risk", "questions", "quality", "evidence", "pipeline"];

  // build nav grouped
  const nav = document.getElementById("nav");
  let navHtml = "";
  groups.forEach((g) => {
    navHtml += `<div class="nav-group">${g}</div>`;
    order.filter((k) => S[k].group === g).forEach((k) => {
      navHtml += `<div class="nav-item" data-screen="${k}">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICON[S[k].icon] || ""}</svg>
        <span>${S[k].nav}</span></div>`;
    });
  });
  navHtml += `<div class="nav-spacer"></div><div class="nav-foot">
    <div class="freshness"><span class="dot-live"></span> Snapshot fresh</div>
    <div class="snap">${OAI.snapshot.name} · 7,173 leads</div></div>`;
  nav.innerHTML = navHtml;

  const main = document.getElementById("main");
  const crumb = document.getElementById("crumb");
  let current = null;

  function route(key) {
    const sc = S[key];
    if (!sc) return;
    current = key;
    crumb.textContent = sc.nav;
    document.querySelectorAll(".nav-item").forEach((n) => n.classList.toggle("active", n.dataset.screen === key));
    const showHead = key !== "executive";
    main.innerHTML = `<div class="screen">
      ${showHead ? `<div class="phead"><div class="eyebrow">${sc.eyebrow || ""}</div><h1 class="ptitle">${sc.title}</h1>${sc.sub ? `<p class="psub">${sc.sub}</p>` : ""}</div>` : ""}
      ${sc.render()}
    </div>`;
    window.scrollTo(0, 0);
    OAIUI.activate(main);
    if (sc.init) sc.init(main);
    if (history.replaceState) history.replaceState(null, "", "#" + key);
  }

  nav.addEventListener("click", (e) => {
    const item = e.target.closest(".nav-item");
    if (item) route(item.dataset.screen);
  });

  // explain-this-number delegation
  main.addEventListener("click", (e) => {
    const stat = e.target.closest("[data-metric]");
    if (stat) OAIUI.explainMetric(stat.dataset.metric);
  });

  // mode toggle
  document.getElementById("modeToggle").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("#modeToggle button").forEach((x) => x.classList.toggle("on", x === b));
    document.body.classList.toggle("exec", b.dataset.mode === "exec");
  });

  // presentation mode
  document.getElementById("presentBtn").addEventListener("click", () => {
    document.body.classList.toggle("present");
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.body.classList.remove("present"); });

  // light / dark theme (persistent)
  const themeBtn = document.getElementById("themeBtn");
  const themeLbl = document.getElementById("themeLbl");
  function applyTheme(t) {
    const light = t === "light";
    document.body.classList.toggle("light", light);
    themeLbl.textContent = light ? "Dark" : "Light";
  }
  applyTheme(localStorage.getItem("oai-theme") || "dark");
  themeBtn.addEventListener("click", () => {
    const next = document.body.classList.contains("light") ? "dark" : "light";
    localStorage.setItem("oai-theme", next);
    applyTheme(next);
  });

  OAIUI.initDrawer();
  const start = (location.hash || "").replace("#", "");
  route(S[start] ? start : "executive");
})();
</script>
</body>
</html>
