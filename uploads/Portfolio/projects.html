<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahmed Soubhi Aljundi — Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Doto:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1ea; --panel:#fffdf8; --ink:#17140f; --mut:#6f685c;
    --line:rgba(23,20,15,.12); --accent:#ff5900; --chip:#ece8df;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:"Geist Mono",monospace}
  .wrap{max-width:1360px;margin:0 auto;padding:0 40px}

  /* header */
  header{position:sticky;top:0;z-index:50;background:rgba(244,241,234,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:16px 40px;font-family:"Geist Mono",monospace;font-size:12px;letter-spacing:.03em}
  .brand{display:flex;align-items:center;gap:12px}
  .mono-tag{color:var(--mut)}
  .logo{width:26px;height:26px;border-radius:7px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:"Instrument Serif",serif;font-size:15px}
  .clocks{display:flex;gap:34px}
  .clock small{display:block;color:var(--mut);font-size:10.5px;letter-spacing:.08em}
  .clock b{font-weight:500}
  .clock .t{background:#e7e2d7;border-radius:4px;padding:1px 5px;margin-right:2px}
  .right{display:flex;align-items:center;gap:26px}
  .right .yr{color:var(--accent)}
  .avatar{width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);background:#d9d3c6 center/cover no-repeat;display:grid;place-items:center;color:var(--mut);font-size:9px;text-align:center}
  @media(max-width:820px){.clocks{display:none}}

  /* hero title */
  .head{padding:34px 0 8px;display:flex;align-items:flex-start;justify-content:space-between}
  .head h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:clamp(4rem,15vw,12rem);line-height:.86;letter-spacing:-.01em;color:var(--accent)}
  .head .count{font-family:"Geist Mono",monospace;color:var(--accent);font-size:14px;margin-top:14px}
  .kick{font-family:"Geist Mono",monospace;font-size:12px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase;padding:0 0 22px}
  .rule{height:1px;background:var(--line)}

  /* project */
  .proj{padding:80px 0;border-bottom:1px solid var(--line);opacity:0;transform:translateY(26px);transition:opacity .8s ease,transform .8s ease}
  .proj.in{opacity:1;transform:none}
  .grid{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
  .frame{position:relative;border-radius:16px;padding:30px;overflow:hidden;box-shadow:0 30px 60px -34px rgba(23,20,15,.45)}
  .frame img{width:100%;height:auto;display:block;border-radius:8px;box-shadow:0 14px 34px -18px rgba(0,0,0,.5)}
  .g1{background:linear-gradient(140deg,#2b3a67,#4a63a8 55%,#c9d2ec)}
  .g2{background:linear-gradient(140deg,#e9edf6,#cdd7ee 60%,#a9b8e6)}
  .g3{background:linear-gradient(140deg,#0d2b30,#12464b 60%,#1d6f77)}
  .g4{background:linear-gradient(140deg,#0a1730,#122246 55%,#20407e)}
  .info .yr{float:right;font-family:"Geist Mono",monospace;color:var(--accent);font-size:13px}
  .info h2{font-family:"Instrument Serif",serif;font-weight:400;font-size:clamp(2.4rem,4.4vw,3.6rem);line-height:1.02;letter-spacing:-.01em;margin-bottom:20px}
  .info p{color:var(--mut);font-size:1.02rem;line-height:1.62;margin-bottom:16px;max-width:52ch}
  .info p.infra{color:#453f34;font-size:.94rem}
  .info p.infra b{color:var(--ink);font-weight:600}
  .tags{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 4px}
  .tags span{font-family:"Geist Mono",monospace;font-size:11px;letter-spacing:.02em;color:#40382c;background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:5px 9px}
  .metrics{display:flex;flex-wrap:wrap;gap:22px;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
  .metrics div b{display:block;font-family:"Instrument Serif",serif;font-size:1.7rem;line-height:1}
  .metrics div small{font-family:"Geist Mono",monospace;font-size:10.5px;color:var(--mut);letter-spacing:.03em;text-transform:uppercase}
  .note{font-family:"Geist Mono",monospace;font-size:10.5px;color:var(--mut);margin-top:12px;letter-spacing:.02em}

  /* gallery strip */
  .galwrap{margin-top:34px}
  .gallabel{font-family:"Geist Mono",monospace;font-size:11px;color:var(--mut);letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
  .gal{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
  .gal img{height:190px;width:auto;border-radius:8px;border:1px solid var(--line);flex:0 0 auto;background:#fff;box-shadow:0 10px 26px -18px rgba(0,0,0,.4)}

  footer{padding:70px 0 90px;text-align:center}
  footer h3{font-family:"Instrument Serif",serif;font-size:clamp(2rem,5vw,3.4rem);font-weight:400}
  footer a{color:var(--accent);text-decoration:none}
  footer .links{margin-top:22px;font-family:"Geist Mono",monospace;font-size:13px;display:flex;gap:24px;justify-content:center;flex-wrap:wrap;color:var(--mut)}

  @media(max-width:900px){
    .wrap{padding:0 22px}.bar{padding:14px 22px}
    .grid{grid-template-columns:1fr;gap:28px}
    .frame{padding:18px}
    .head{flex-direction:column}
  }
  @media(prefers-reduced-motion:reduce){.proj{opacity:1;transform:none;transition:none}}
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="brand"><span class="logo">A</span><span class="mono-tag">WORKS</span></div>
    <div class="clocks">
      <div class="clock"><small>DUBAI, UAE</small><b><span class="t" id="d-h">00</span><span class="t" id="d-m">00</span> <span class="mono-tag" id="d-ap">AM (GMT+4)</span></b></div>
      <div class="clock"><small>BAGHDAD, IRAQ</small><b><span class="t" id="b-h">00</span><span class="t" id="b-m">00</span> <span class="mono-tag" id="b-ap">AM (GMT+3)</span></b></div>
    </div>
    <div class="right"><span class="yr">( 2024 &nbsp;&ndash;&nbsp; 2026 )</span><span>CONTACT ME</span><span class="avatar" title="photo slot">PHOTO</span></div>
  </div>
</header>

<div class="wrap">
  <div class="head">
    <div>
      <div class="kick">Ahmed Soubhi Aljundi &middot; Agentic AI &amp; Automation Engineer &middot; Dubai</div>
      <h1>Projects</h1>
    </div>
    <div class="count" id="count">( 4 )</div>
  </div>
  <div class="rule"></div>

  <div id="list"></div>

  <footer>
    <h3>Let&rsquo;s build something that runs itself.</h3>
    <div class="links">
      <a href="mailto:ahmedsoubhi.2002@gmail.com">ahmedsoubhi.2002@gmail.com</a>
      <span>+971 56 270 0521</span>
      <a href="https://linkedin.com/in/ahmed-soubhi-aljundi">LinkedIn</a>
      <a href="https://github.com/AhmedSoubhi">GitHub</a>
    </div>
  </footer>
</div>

<script>
const PROJECTS = [
  {
    year:"2025 — 2026", grad:"g1", title:"OG Tech Operations Suite",
    desc:"OG Tech (internally Logestechs) runs a courier and fulfillment business end to end: shipments, warehouse inventory, order fulfillment, driver dispatch, and cash accounting, all in one login. I was a main full-stack developer on the team, building across the web app, the OG TECH driver mobile app, and the backend. It is multi-branch, multi-tenant, and multi-role, and it is now being productized to sell to other logistics companies.",
    infra:"<b>Six modules on one core:</b> Shipments, Shipping Manager, Warehouse, Fulfillment, Accounting, and a driver mobile app. Role-based access for 7 roles, WhatsApp sign-in and password reset, a map-based route planner, append-only cash ledgers with driver-handover reconciliation, branded client portals, and offline-capable delivery on the phone. (Django, React, Flutter, PostgreSQL, AWS.)",
    tags:["FULL-STACK","REACT","FLUTTER","DJANGO","WEB & MOBILE","DEV CONTROL"],
    metrics:[["~24,900","shipments run"],["438","client businesses"],["60","drivers"],["6","modules"]],
    hero:"assets/ogtech-03.png",
    gallery:["assets/ogtech-01.png","assets/ogtech-06.png","assets/ogtech-07.png","assets/ogtech-08.png","assets/ogtech-09.png","assets/ogtech-mobile-login.png","assets/ogtech-mobile-dashboard.png","assets/ogtech-mobile-order.png","assets/ogtech-10.png","assets/ogtech-11.png"]
  },
  {
    year:"2025 — 2026", grad:"g2", title:"Ocean Gate CRM & Chat",
    desc:"I built and customized the company&rsquo;s sales CRM in Odoo 18: a manager Executive Control Tower where the whole team&rsquo;s KPIs, targets, and cash sit on one screen, a per-rep view scoped to each salesperson, and a chat workspace that brings WhatsApp, Instagram, and Messenger into one inbox with lead assignment, notes, and a per-chat AI toggle.",
    infra:"<b>19 custom Odoo modules</b> with OWL front-end components extending stock Odoo, and hand-written SQL for the KPIs (response times, overdue leads, calls, revenue, AI time saved). 20+ KPIs, manager-set targets, weighted round-robin routing, a click-to-call softphone, and a train-the-bot feedback loop. (Odoo 18, Python, OWL, PostgreSQL.)",
    tags:["ODOO 18","PYTHON","OWL","POSTGRESQL","FULL-STACK","UI DESIGN"],
    metrics:[["19","custom modules"],["20+","live KPIs"],["7","user roles"],["3","chat channels"]],
    hero:"assets/odoo-admin-dashboard.png",
    gallery:["assets/crm-03.png","assets/odoo-chat-workspace.png","assets/odoo-new-crm.png","assets/odoo-set-goals.png","assets/odoo-call-logs.png","assets/odoo-vendor-bills.png","assets/crm-06.png"]
  },
  {
    year:"2025 — 2026", grad:"g3", title:"Haydar, the AI sales agent",
    desc:"I built the AI sales agent that answers inbound chats on WhatsApp, Instagram, and Messenger, in Iraqi Arabic or English. It reads the whole conversation, even turning voice notes and product photos into text, answers from the company knowledge base only when it is confident, and hands anything off-topic or uncertain to a human rep, so customers never get a made-up reply.",
    infra:"<b>A layered decision engine:</b> OpenAI extracts the state, a RAG search (Pinecone, embeddings, and a multilingual reranker) finds the approved answer, multi-gate confidence checks decide whether to answer or hand off, and OpenAI writes the final reply. The sales team edits the knowledge base and restricted-cargo list from Odoo, and a golden-eval suite guards every change. (FastAPI, OpenAI, Pinecone, LangChain, n8n, Odoo, AWS.)",
    tags:["AGENTIC AI","RAG","OPENAI","PINECONE","FASTAPI","GUARDRAILS"],
    metrics:[["41s","median reply vs 8.2h"],["31%","ever needed a human"],["51%","messages off-hours"],["95.1%","routing accuracy*"]],
    note:"* 95.1% is routing accuracy on a 47-case Arabic test set, not overall answer-correctness.",
    hero:"assets/ai-how-it-works.png",
    gallery:["assets/crm-07.png","assets/odoo-chat-filters.png","assets/odoo-bot-kb.png","assets/odoo-train-bot.png","assets/ai-playground.png"]
  },
  {
    year:"2026", grad:"g4", title:"AI Conversation Intelligence",
    desc:"I built the pipeline that read about 88,000 past customer and sales chat messages across 7,173 leads and turned them into sales and marketing intelligence: who is ready to buy, why deals are won or lost, how fast reps respond, and which products, lanes, and channels drive demand. Sales and marketing insight live under one project because both come from the same conversation data we recovered and mined.",
    infra:"<b>An offline pipeline</b> that recovered conversations from a broken Odoo backup, repaired Arabic text, had OpenAI read each conversation into a structured fact sheet, then aggregated 7,173 leads into demand and performance insight plus a proposed set of CRM staging rules. Labeling all 7,173 leads cost about 5 US dollars. (Python, OpenAI structured outputs, FastAPI, PostgreSQL.)",
    tags:["DATA MINING","LLM ANALYSIS","PYTHON","STRUCTURED OUTPUTS","INSIGHTS"],
    metrics:[["88,000+","messages read"],["7,173","leads analyzed"],["2,200+","ready-to-buy leads"],["4.3x","win lift with a human"]],
    hero:"assets/ai-88k.png",
    gallery:["assets/ai-lead-staging.png","assets/ai-resync-01-resync.png","assets/ai-resync-02-resync.png","assets/ai-resync-03-resync.png"]
  }
];

const list = document.getElementById('list');
document.getElementById('count').textContent = "( " + PROJECTS.length + " )";
PROJECTS.forEach(p=>{
  const el = document.createElement('section');
  el.className = 'proj';
  el.innerHTML = `
    <div class="grid">
      <div class="frame ${p.grad}"><img loading="lazy" src="${p.hero}" alt="${p.title}"></div>
      <div class="info">
        <span class="yr">( ${p.year} )</span>
        <h2>${p.title}</h2>
        <p>${p.desc}</p>
        <p class="infra">${p.infra}</p>
        <div class="tags">${p.tags.map(t=>`<span>${t}</span>`).join('')}</div>
        <div class="metrics">${p.metrics.map(m=>`<div><b>${m[0]}</b><small>${m[1]}</small></div>`).join('')}</div>
        ${p.note?`<div class="note">${p.note}</div>`:''}
      </div>
    </div>
    <div class="galwrap">
      <div class="gallabel">Infrastructure &amp; proof &middot; scroll &rarr;</div>
      <div class="gal">${p.gallery.map(g=>`<img loading="lazy" src="${g}" alt="proof">`).join('')}</div>
    </div>`;
  list.appendChild(el);
});

const io = new IntersectionObserver((es)=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }),{threshold:.12});
document.querySelectorAll('.proj').forEach(el=>io.observe(el));

function tick(){
  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset()*60000;
  function set(offset,pre){
    const d = new Date(utc + offset*3600000);
    let h = d.getHours(); const m = d.getMinutes();
    const ap = h<12 ? 'AM' : 'PM'; let hh = h%12; if(hh===0) hh=12;
    document.getElementById(pre+'-h').textContent = String(hh).padStart(2,'0');
    document.getElementById(pre+'-m').textContent = String(m).padStart(2,'0');
    document.getElementById(pre+'-ap').textContent = ap + (pre==='d'?' (GMT+4)':' (GMT+3)');
  }
  set(4,'d'); set(3,'b');
}
tick(); setInterval(tick,1000);
</script>
</body>
</html>
